<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goldman Robotics</title>
  <meta name="description" content="Goldman Robotics — надежные и эффективные ИИ-сотрудники">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..500&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #121316; --bg: #ffffff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body {
      min-height: 100vh; min-height: 100svh;
      display: flex; align-items: center; justify-content: center;
      padding: 60px 22px; text-align: center;
      font-family: "Golos Text", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      margin: 0;
      font-family: Unbounded, Arial, sans-serif; font-weight: 700;
      font-size: clamp(34px, 5.4vw, 78px); line-height: 1.18; letter-spacing: -0.04em;
    }
    p {
      margin: 30px 0 0;
      font-weight: 450;
      font-size: clamp(23px, 2.57vw, 37px); line-height: 1.3; letter-spacing: -0.025em;
    }
    .no-wrap { white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1>Goldman Robotics</h1>
    <p>Надежные и эффективные <span class="no-wrap">ИИ-сотрудники</span></p>
  </main>
</body>
</html>
